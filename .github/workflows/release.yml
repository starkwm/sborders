name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'starkwm/sborders' && !github.event.deleted
    permissions:
      contents: write
    uses: starkwm/workflows/.github/workflows/release-bottle.yml@a2eabb6251b6ce3e9d8daeababb362ead26ac7e2
    secrets:
      HOMEBREW_TAP_APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
