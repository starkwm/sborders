name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'starkwm/sborders' && !github.event.deleted
    permissions:
      contents: write
    uses: starkwm/workflows/.github/workflows/release-bottle.yml@fb41a4e2c943e782f0f0cc791a920679b415b101
    with:
      version-prefix: sborders version
    secrets:
      HOMEBREW_TAP_APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
